aid: oosto
name: Oosto
description: 'Oosto (formerly AnyVision) is an enterprise vision-AI company providing
  real-time facial recognition, watchlist alerting, and video analytics for physical
  security, safety, and touchless access control. Its platform spans OnWatch real-time
  watchlist monitoring, OnAccess touchless facial-recognition access control, and Oosto
  Protect edge-to-cloud video analytics (person-of-interest detection, body/skeleton
  and pose/action recognition, and liveness detection), delivered via cloud, on-premises,
  and SDK deployments and integrating with existing VMS and camera systems. Backed by
  SoftBank Vision Fund. Oosto exposes no public self-serve developer API; its technical
  documentation lives in a login-gated partner knowledge base.'
